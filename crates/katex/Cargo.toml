[package]
name = "katex-rs"
readme = "../../README.md"
publish = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "A Rust implementation of KaTeX - Fast math typesetting for anywhere, more than just the web."
categories = ["mathematics", "wasm", "parsing"]
keywords = ["latex", "math", "katex", "wasm", "parsing"]
include = [
    "../../LICENSE",
    "../../README.md",
    "data/**",
    "src/**/*.rs",
    "benches/**",
    "tests/**",
    "utils/**",
]

[lib]
name = "katex"

[dependencies]
# Core dependencies
thiserror = "2.0.20"

# WebAssembly support
wasm-bindgen = { version = "0.2.128", optional = true }
js-sys = { version = "0.3.105", optional = true }
web-sys = { version = "0.3.105", features = ["Document", "DocumentFragment", "Node", "Element", "Window", "Text"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
# `mathml`: the MathML builders and the `Mathml` / `HtmlAndMathml` outputs. Off, those outputs are HTML only and the builders are not linked in
# (the WebAssembly bundle of crates/katex-wasm needs neither).
default = ["mathml", "sizes", "diagnostics", "std-float"]
mathml = []
# `sizes`: `Settings::compact_sizes` and `compact::take_sizes` (the widths of stacks and formulas computed from the tree, `crate::sizes`).
sizes = []
# `diagnostics`: `Debug` dumps of parse nodes and tokens in a few error messages (`\begin`, `\end`), and the `\show` macro (prints to stdout). Off, the messages name the token
# only and `\show` does nothing: the `Debug` implementations of every parse node are not linked in.
diagnostics = []
# `std-float`: numbers are read and written with core's float parser and formatter. Off, `numfmt` has small routines instead (exact for what the renderer writes
# and reads, see there), `compact_precision` is ignored, and about 25 KB of core's float code and tables are not linked in.
std-float = []
# `fast-hash`: the tables are hashed with a multiply-and-rotate hash instead of SipHash with random keys (smaller and faster; `MacroMap` and `KeyMap` have another type then).
fast-hash = []
# `fixed-levels`: the compact output always uses `levels::ALL | levels::FONT_RUN` (`Settings::compact_levels` is ignored), so the code of the other levels is not linked in.
fixed-levels = []
# `packed-symbols`: the symbol tables are read from `generated/symbols_packed.bin` (tools/gen_tables.py: about 600 entries; the keys of `acceptUnicodeChar` are derived) into the
# context's tables when it is made, instead of the 966 entries of the static tables of `generated/symbols_data.rs` that lookups fall back on.
packed-symbols = []
# `packed-metrics`: the character metrics are read from `generated/font_metrics_packed.bin` (columns of LEB128 numbers, about half the transferred size in a WebAssembly bundle),
# unpacked when the `KatexContext` is made, instead of the constant tables of `generated/font_metrics_data.rs`.
packed-metrics = []
backtrace = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "perf_gungraun"
harness = false

[dev-dependencies]
serde_json = "1.0.151"
btparse = "0.2.0"
wasm-bindgen-test = "0.3.78"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { version = "0.9.34" }
regex = "1.13.1"
insta = { version = "1.48.0", features = ["glob"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gag = "1.0.0"
# Native benchmark runners cannot compile for wasm32 browser tests.
gungraun = "0.19.4"
criterion = { version = "0.8.2", default-features = false }

[lints]
workspace = true
